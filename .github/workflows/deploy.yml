name: Deploy Changed Templates

on:
  # Run after Generate Templates has committed templates.json for the push,
  # so the deploy uses the new catalog, not the old one.
  workflow_run:
    workflows:
      - Generate Templates
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      template:
        description: Template id or template directory name to test-deploy
        required: true
        type: string

# Run one workflow at a time to avoid conflicts on the test host
concurrency:
  group: deploy-templates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect-and-deploy:
    # Manual runs, or a successful Generate Templates run started by a push.
    # Skip failed generations so the deploy never tests a stale catalog.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      # Checks out main after Generate Templates, including the new templates.json
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need the history of the original push commit

      - name: Detect changed templates
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TEMPLATE: ${{ inputs.template }}
          PUSH_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          template_id_of() {
            grep "^id:" "$1/.dollardeploy.yml" | head -1 | sed 's/^id: *//' | tr -d "\r\"'"
          }

          declare -A seen=()
          templates=()

          add_template() {
            local id="$1"
            if [ -n "$id" ] && [ -z "${seen[$id]:-}" ]; then
              seen[$id]=1
              templates+=("$id")
            fi
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            input="$(echo "$INPUT_TEMPLATE" | tr -d '[:space:]')"
            if ! [[ "$input" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Invalid template input: '$INPUT_TEMPLATE'"
              exit 1
            fi
            # A template directory resolves to the id in its .dollardeploy.yml
            if [ -f "$input/.dollardeploy.yml" ]; then
              add_template "$(template_id_of "$input")"
            else
              add_template "$input"
            fi
          else
            # Compare the original push commit, not the later templates.json commit
            echo "Changed files in $PUSH_SHA:"
            git diff --name-only "$PUSH_SHA~1" "$PUSH_SHA" | tee /tmp/changed-files.txt

            while IFS= read -r file; do
              dir="${file%%/*}"
              if [ "$dir" != "$file" ] && [ -f "$dir/.dollardeploy.yml" ]; then
                add_template "$(template_id_of "$dir")"
              fi
            done < /tmp/changed-files.txt
          fi

          echo "Templates to deploy: ${templates[*]:-none}"
          echo "templates=${templates[*]:-}" >> "$GITHUB_OUTPUT"

      - name: Show catalog version
        if: steps.detect.outputs.templates != ''
        env:
          TEMPLATES: ${{ steps.detect.outputs.templates }}
        run: |
          echo "templates.json at $(git rev-parse HEAD) ($(git log -1 --format=%s -- templates.json))"
          for template in $TEMPLATES; do
            entry="$(jq -c --arg id "$template" '.[] | select(.id == $id) | {id, updatedAt, app}' templates.json)"
            echo "Catalog entry for $template: ${entry:-not found in templates.json}"
          done

      # The platform reads templates.json from raw.githubusercontent.com with a
      # 5 minute app cache on top of the CDN cache, and ddc does not expose the
      # template version to poll for, so wait until the cache has expired.
      - name: Wait for the platform catalog cache
        if: steps.detect.outputs.templates != '' && github.event_name == 'workflow_run'
        env:
          GENERATED_AT: ${{ github.event.workflow_run.updated_at }}
          CACHE_WAIT_SECONDS: 360
        run: |
          elapsed=$(( $(date +%s) - $(date -d "$GENERATED_AT" +%s) ))
          remaining=$(( CACHE_WAIT_SECONDS - elapsed ))
          if [ "$remaining" -le 0 ]; then
            echo "Generate Templates finished ${elapsed}s ago, the catalog cache has expired."
            exit 0
          fi
          echo "Waiting ${remaining}s: a fixed ${CACHE_WAIT_SECONDS}s after Generate Templates (finished at $GENERATED_AT) for the platform template cache to expire, because ddc does not expose the catalog version."
          sleep "$remaining"

      - name: Setup Node.js
        if: steps.detect.outputs.templates != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install DollarDeploy CLI
        if: steps.detect.outputs.templates != ''
        run: |
          npm i -g @dollardeploy/cli@1
          ddc --version

      - name: Deploy templates
        if: steps.detect.outputs.templates != ''
        env:
          TEMPLATES: ${{ steps.detect.outputs.templates }}
          DOLLARDEPLOY_API_KEY: ${{ secrets.DOLLARDEPLOY_API_KEY }}
          DOLLARDEPLOY_BASE_URL: ${{ secrets.DOLLARDEPLOY_BASE_URL }}
          DOLLARDEPLOY_SCREENSHOT_URL: ${{ secrets.DOLLARDEPLOY_SCREENSHOT_URL }}
          DOLLARDEPLOY_TEST_HOST_ID: ${{ vars.DOLLARDEPLOY_TEST_HOST_ID }}
          PUSH_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          failed=0
          {
            echo "## Template test deploys"
            echo
            if [ -n "$PUSH_SHA" ]; then
              echo "Push: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$PUSH_SHA"
              echo
            fi
            echo "| Template | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for template in $TEMPLATES; do
            echo "::group::Deploy $template"
            if bash scripts/deploy-template.sh "$template"; then
              result="passed"
            else
              result="failed"
              failed=1
              echo "::error::Test deploy of template $template failed. See the ddc error above."
            fi
            echo "::endgroup::"
            echo "| \`$template\` | $result |" >> "$GITHUB_STEP_SUMMARY"
          done

          exit "$failed"
