name: Deploy Changed Templates

on:
  push:
    branches:
      - main
    paths-ignore:
      - templates.json
      - .github/**
      - scripts/**
      - README.md
  workflow_dispatch:
    inputs:
      template:
        description: Template id or template directory name to test-deploy
        required: true
        type: string

# Run one workflow at a time to avoid conflicts on the test host
concurrency:
  group: deploy-templates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Need at least 2 commits to compare changes

      - name: Detect changed templates
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TEMPLATE: ${{ inputs.template }}
        run: |
          template_id_of() {
            grep "^id:" "$1/.dollardeploy.yml" | head -1 | sed 's/^id: *//' | tr -d "\r\"'"
          }

          declare -A seen=()
          templates=()

          add_template() {
            local id="$1"
            if [ -n "$id" ] && [ -z "${seen[$id]:-}" ]; then
              seen[$id]=1
              templates+=("$id")
            fi
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            input="$(echo "$INPUT_TEMPLATE" | tr -d '[:space:]')"
            if ! [[ "$input" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Invalid template input: '$INPUT_TEMPLATE'"
              exit 1
            fi
            # A template directory resolves to the id in its .dollardeploy.yml
            if [ -f "$input/.dollardeploy.yml" ]; then
              add_template "$(template_id_of "$input")"
            else
              add_template "$input"
            fi
          else
            echo "Changed files:"
            git diff --name-only HEAD~1 HEAD | tee /tmp/changed-files.txt

            while IFS= read -r file; do
              dir="${file%%/*}"
              if [ "$dir" != "$file" ] && [ -f "$dir/.dollardeploy.yml" ]; then
                add_template "$(template_id_of "$dir")"
              fi
            done < /tmp/changed-files.txt
          fi

          echo "Templates to deploy: ${templates[*]:-none}"
          echo "templates=${templates[*]:-}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.detect.outputs.templates != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install DollarDeploy CLI
        if: steps.detect.outputs.templates != ''
        run: |
          npm i -g @dollardeploy/cli@1
          ddc --version

      - name: Deploy templates
        if: steps.detect.outputs.templates != ''
        env:
          TEMPLATES: ${{ steps.detect.outputs.templates }}
          DOLLARDEPLOY_API_KEY: ${{ secrets.DOLLARDEPLOY_API_KEY }}
          DOLLARDEPLOY_BASE_URL: ${{ secrets.DOLLARDEPLOY_BASE_URL }}
          DOLLARDEPLOY_SCREENSHOT_URL: ${{ secrets.DOLLARDEPLOY_SCREENSHOT_URL }}
          DOLLARDEPLOY_TEST_HOST_ID: ${{ vars.DOLLARDEPLOY_TEST_HOST_ID }}
        run: |
          failed=0
          {
            echo "## Template test deploys"
            echo
            echo "| Template | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for template in $TEMPLATES; do
            echo "::group::Deploy $template"
            if bash scripts/deploy-template.sh "$template"; then
              result="passed"
            else
              result="failed"
              failed=1
              echo "::error::Test deploy of template $template failed. See the ddc error above."
            fi
            echo "::endgroup::"
            echo "| \`$template\` | $result |" >> "$GITHUB_STEP_SUMMARY"
          done

          exit "$failed"
