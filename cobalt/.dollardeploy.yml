# yaml-language-server: $schema=https://raw.githubusercontent.com/dollardeploy/.github/refs/heads/main/template.schema.json
id: cobalt
name: Cobalt
intro: Save media from social platforms — the full cobalt web app plus its own processing instance.
logo: https://avatars.githubusercontent.com/u/152056268
experimental: true
deployTime: ~8 minutes
tags:
  - media
  - downloader
  - privacy
  - api
  - oss
description: |
  Cobalt saves media from social platforms without ads, trackers, or paywalls.

  This template runs both halves on one domain: the cobalt web frontend at `/`
  (built from source at deploy time) and your own processing instance — the API
  that does the actual work — on the same origin. Nothing is shared with
  cobalt.tools, and any cobalt client can point at this domain directly.

  Bandwidth, not CPU, is the limit: tunnelled downloads stream through your
  server. Keep it to yourself, or turn on Cloudflare Turnstile
  (`TURNSTILE_SITEKEY` + `TURNSTILE_SECRET`) before sharing the URL.

  The frontend is licensed CC-BY-NC-SA-4.0 — unmodified non-commercial hosting
  only, and cobalt branding stays copyrighted.
requirements:
  memory: 2048
  cpu: 2
  storage: 15
services:
  - docker
app:
  type: docker-compose
  repositoryUrl: https://github.com/dollardeploy/templates
  sourceBranch: main
  sourcePath: cobalt
  dockerComposeFile: docker-compose.yml
  mainPort: 8080
  env:
    DOCKER_COMPOSE_BUILD: 1
    PORT: "8080"
    COBALT_REF: main
    API_URL: ${APP_URL}
    WEB_DEFAULT_API: ${APP_URL}
    WEB_HOST: ${APP_HOSTNAME}
    JWT_SECRET: ${GENERATED_HASH}
    API_AUTH_REQUIRED: "0"
    TURNSTILE_SITEKEY: ""
    TURNSTILE_SECRET: ""
    RATELIMIT_WINDOW: "60"
    RATELIMIT_MAX: "20"
    DURATION_LIMIT: "10800"
    APP_HEALTHCHECK_PATH: "/"
    APP_READY_TIMEOUT: "900"
postLaunchNote: |
  Open **${APP_URL}** and paste a link — that's the whole app, running on your
  own instance. The same URL is also the processing API — point another cobalt
  client at it, or `POST` to it with `{"url": "..."}` from a script.

  It's public by default. To lock it down, set `API_AUTH_REQUIRED` to `1` — then
  only requests carrying the API key in `keys/keys.json` (printed in the
  `keygen` deploy logs) get through. Paste that UUID into settings → processing
  → instance access key. `TURNSTILE_SITEKEY` + `TURNSTILE_SECRET` gate browser
  users instead.

  First deploy builds the frontend from source, so give it a few extra minutes.
