services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COBALT_REF: ${COBALT_REF}
        WEB_DEFAULT_API: ${WEB_DEFAULT_API}
        WEB_HOST: ${WEB_HOST}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT}:80"
    depends_on:
      - cobalt

  # generates an api key (uuid v4) on first boot, keeps it across redeploys.
  # ponytail: a 3-line init beats asking people to hand-write keys.json.
  keygen:
    image: alpine:3
    volumes:
      - ./keys:/keys
    command: >
      sh -c 'test -f /keys/keys.json ||
      printf "{\"%s\":{\"name\":\"default\",\"limit\":\"unlimited\"}}" "$$(cat /proc/sys/kernel/random/uuid)" > /keys/keys.json;
      echo "cobalt api key file:"; cat /keys/keys.json'

  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    init: true
    read_only: true
    restart: unless-stopped
    expose:
      - "9000"
    depends_on:
      keygen:
        condition: service_completed_successfully
    volumes:
      - ./keys:/keys:ro
    environment:
      API_URL: ${API_URL}
      JWT_SECRET: ${JWT_SECRET}
      API_KEY_URL: "file:///keys/keys.json"
      # 1 = nobody gets in without an api key (or turnstile, if configured).
      # 0 = keys just bypass the rate limits, everyone else is rate limited.
      API_AUTH_REQUIRED: ${API_AUTH_REQUIRED}
      # optional bot protection: create a Turnstile widget at
      # https://dash.cloudflare.com/?to=/:account/turnstile and set both values.
      # turnstile only kicks in when sitekey + secret are both non-empty.
      TURNSTILE_SITEKEY: ${TURNSTILE_SITEKEY}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET}
      RATELIMIT_WINDOW: ${RATELIMIT_WINDOW}
      RATELIMIT_MAX: ${RATELIMIT_MAX}
      DURATION_LIMIT: ${DURATION_LIMIT}
# ponytail: no watchtower (upstream's example uses it) — redeploy from
# DollarDeploy to pull a new image instead of mounting the docker socket.
