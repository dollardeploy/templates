# the cobalt frontend resolves its api url with `new URL(DEFAULT_API).origin`,
# which drops any path — so the api must answer at the origin root, not /api/.
# the only real collision is GET /: a browser navigation wants index.html, the
# frontend's serverInfo fetch wants the api's json. browsers send
# `Accept: text/html...` on navigation and `*/*` on fetch(), so split on that.
map $http_accept $root_wants_html {
    default       0;
    "~*text/html" 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # behind DollarDeploy's proxy, nginx must not rewrite /about to
    # http://localhost:8080/about/ — keep directory redirects relative
    absolute_redirect off;

    location = / {
        include /etc/nginx/cobalt-proxy.conf;
        if ($root_wants_html = 0) {
            proxy_pass http://cobalt:9000;
        }

        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
        try_files /index.html =404;
    }

    # the frontend is a static sveltekit build: /about is about.html on disk,
    # and /404.html is the fallback route.
    location / {
        try_files $uri $uri.html $uri/index.html /404.html;

        # cobalt's in-browser remux/encode (libav wasm) needs SharedArrayBuffer,
        # which needs cross-origin isolation. same as the build's _headers file.
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
    }

    # api routes that don't collide with the frontend
    location = /session {
        proxy_pass http://cobalt:9000/session;
        include /etc/nginx/cobalt-proxy.conf;
    }

    location = /tunnel {
        proxy_pass http://cobalt:9000/tunnel;
        include /etc/nginx/cobalt-proxy.conf;

        # downloads stream through here: no buffering, no size cap, long reads
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 0;
    }
}
