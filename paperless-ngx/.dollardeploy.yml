id: paperless-ngx
name: Paperless-ngx
intro: Scan, index, and archive all your physical documents into a searchable online archive.
description: |
  Paperless-ngx is a document management system that transforms your physical documents
  into a searchable online archive so you can keep, well, less paper.

  Includes PostgreSQL for storage, Valkey (Redis-compatible) for task queuing, and
  Gotenberg + Apache Tika for full-text OCR and Office document conversion.
logo: https://raw.githubusercontent.com/paperless-ngx/paperless-ngx/refs/heads/dev/docs/assets/logo_leaf.svg
experimental: true
tags:
  - oss
  - docker
  - storage
  - management
deployTime: "~5 minutes"
requirements:
  memory: 2048
  cpu: 2
  storage: 20
services:
  - docker
app:
  type: docker-compose
  repositoryUrl: https://github.com/dollardeploy/templates
  sourcePath: paperless-ngx
  sourceBranch: main
  dockerComposeFile: docker-compose.yml
  mainPort: 8000
  env:
    PORT: "8000"
    POSTGRES_PASSWORD: "${GENERATED_PWD}"
    PAPERLESS_SECRET_KEY: "${GENERATED_SECRET}"
    PAPERLESS_ADMIN_USER: admin
    PAPERLESS_ADMIN_MAIL: "${USER_EMAIL}"
    PAPERLESS_ADMIN_PASSWORD: "${GENERATED_PWD}"
    DOCKER_COMPOSE_WAIT_TIMEOUT: "300"
postLaunchNote: |
  Login with username **${PAPERLESS_ADMIN_USER}** and password **${PAPERLESS_ADMIN_PASSWORD}**.
source: https://github.com/dollardeploy/templates
