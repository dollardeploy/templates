id: vllm
name: vLLM
intro: Run an OpenAI & Claude inference endpoint with vLLM 
logo: https://avatars.githubusercontent.com/u/136984999
tags:
  - ai
  - llm
  - openai
  - inference
  - vllm
deployTime: ~15 minutes
description: |
  Deploy an OpenAI & Claude compatible REST API endpoint using vLLM with GPU
  acceleration — running natively under systemd instead of Docker. This template
  runs Qwen/Qwen3-Coder-Next across 2 GPUs with tensor parallelism, tool calling
  support, and HuggingFace model caching.

  The endpoint is fully compatible with the OpenAI  /v1/chat/completions and Claude /v1/messages, 
  making it a drop-in replacement for any OpenAI compatible SDK client.

  Use a GPU server with NVIDIA drivers already installed (e.g. Verda 2xA100, 2xH100,
  or similar). Dependencies are managed with uv from a native pyproject.toml, and
  uv auto-selects the PyTorch CUDA wheels matching the host driver (CUDA 12.9 / 13.0),
  so no CUDA toolkit install is required. Set HF_TOKEN to your HuggingFace token to
  download gated models, and adjust the tensor-parallel size in the start command to
  match your GPU count.

  This template is experimental — verify the deployment on your own GPU server
  before relying on it.
requirements:
  memory: 32768
  cpu: 8
  storage: 300
  gpu: 
    model: H100
    count: 2
app:
  type: native
  repositoryUrl: https://github.com/dollardeploy/templates
  sourcePath: vllm
  sourceBranch: main
  backupExcludeFiles: cache
  buildCmd: "true"
  preStartCmd: curl -LsSf https://astral.sh/uv/install.sh | sh
  startCmd: >-
    uv sync &&
    uv run vllm serve ${MODEL_NAME}
    --host 127.0.0.1
    --port ${PORT}
    --tensor-parallel-size ${TENSOR_PARALLEL_SIZE}
    --enable-auto-tool-choice --tool-call-parser ${MODEL_CALL_PARSER}
    --api-key ${VLLM_API_KEY}
    --mm-processor-cache-gb ${MM_PROCESSOR_CACHE_GB}
    --kv-cache-dtype fp8
    --kv-cache-dtype-skip-layers sliding_window
  env:
    PORT: "8000"
    HF_TOKEN: ""
    APP_HEALTHCHECK_PATH: "/health"
    APP_READY_TIMEOUT: 1800
    MODEL_NAME: "Qwen/Qwen3-Coder-Next"
    MODEL_CALL_PARSER: "qwen3_coder"
    UV_TORCH_BACKEND: "auto"
    TENSOR_PARALLEL_SIZE: "2"
    NGINX_STATIC_PATHS: "/index.html:web/index.html"
    VLLM_API_KEY: ${GENERATED_HASH}
    VLLM_CACHE_ROOT: "cache"
    VLLM_SERVER_DEV_MODE: 0
    VLLM_LOGGING_LEVEL: "DEBUG"
    VLLM_CONFIGURE_LOGGING: "1"
    MM_PROCESSOR_CACHE_GB: 8
postLaunchNote: |
    WARNING: You might need to add your HF_TOKEN to the environment variables to download the model. 
    Change it in the app env variables and redeploy. 
  