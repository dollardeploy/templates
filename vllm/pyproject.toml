[project]
name = "vllm-inference"
version = "0.1.0"
description = "OpenAI & Claude compatible inference endpoint powered by vLLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "vllm==0.26.0",
]

[tool.uv]
# This is a runnable application, not an installable library — don't try to
# build/install the project itself, just its dependencies.
package = false

# Use uv's own managed (python-build-standalone) CPython instead of the host's
# /usr/bin/python3. The system interpreter has no development headers, so
# Triton's runtime JIT (used by Qwen3-Next's linear-attention kernels) fails to
# compile with: "fatal error: Python.h: No such file or directory". The managed
# builds bundle the headers. Also enforced via UV_PYTHON_PREFERENCE=only-managed
# and UV_PYTHON=3.12 in .dollardeploy.yml.
python-preference = "only-managed"

# Install the CUDA build of PyTorch that matches the host NVIDIA driver.
# "auto" detects the driver at sync time (via nvidia-smi) and selects the right
# cuXXX wheels. Also enforced via UV_TORCH_BACKEND=auto in .dollardeploy.yml.
# If a host's driver can't be probed and torch falls back to a CPU wheel (vLLM
# then fails with "Failed to infer device type"), pin a specific build here
# instead, e.g. "cu128".
torch-backend = "auto"
