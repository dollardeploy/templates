id: zulipchat
name: Zulip Chat
intro: Organized chat for distributed teams
logo: logo.png
deployTime: ~10 minutes
tags:
  - chat
  - oss
  - popular
description: |
  Zulip is an open source team chat app with topic-based threading, combining the immediacy of real-time chat with the productivity benefits of threaded conversations.
requirements:
  memory: 2048
  cpu: 1
  storage: 10
services:
  - docker
app:
  type: docker-compose
  repositoryUrl: https://github.com/dollardeploy/templates
  sourcePath: zulipchat
  sourceBranch: main
  env:
    POSTGRES_PASSWORD: ${GENERATED_PWD}
    MEMCACHED_PASSWORD: ${GENERATED_PWD}
    RABBITMQ_PASSWORD: ${GENERATED_PWD}
    REDIS_PASSWORD: ${GENERATED_PWD}
    SMTP_PASSWORD: ""
    SMTP_USER: "email@example.com"
    SMTP_HOST: "smtp.example.com"
    SMTP_PORT: "587"
    SMTP_EMAIL_FROM: "email@example.com"
    SMTP_USE_SSL: "False"
    SMTP_USE_TLS: "True"
    ZULIP_VERSION: "11.6-0"
    ZULIP_GIT_REF: "11.6"
    PORT: "8080"
    SECRET_KEY: ${GENERATED_HASH}
